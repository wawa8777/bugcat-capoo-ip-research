name: Publish and verify Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "_headers"
      - ".github/workflows/verify-cloudflare-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-and-verify:
    name: Publish and verify production content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the committed website
        uses: actions/checkout@v4

      - name: Detect Cloudflare deployment credentials without exposing values
        id: cf-credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare API deployment credentials are available."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare API token/account ID are not configured as GitHub Actions secrets; direct API deployment will be skipped."
          fi

      - name: Stage only public website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/index.html
          cp _headers site/_headers
          test -s site/index.html
          test -s site/_headers
          echo "Staged index.html and _headers only."

      - name: Deploy latest website to Cloudflare Pages
        if: steps.cf-credentials.outputs.configured == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site --project-name=bugcat-capoo-ip-research --branch=main

      - name: Verify the actual production response
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const target = 'https://bugcat-capoo-ip-research.pages.dev/';
          const expectedMarker = 'mobile-headings-universal-v3';
          const requiredRule = 'html body main .section>.section-head';
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
          let lastResult = {};

          for (let attempt = 1; attempt <= 5; attempt++) {
            try {
              const url = new URL(target);
              url.searchParams.set('_deployment_probe', String(Date.now()) + '-' + attempt);
              const response = await fetch(url, {
                cache: 'no-store',
                headers: {
                  'cache-control': 'no-cache, no-store, max-age=0',
                  'pragma': 'no-cache'
                },
                signal: AbortSignal.timeout(8000)
              });
              const html = await response.text();
              lastResult = {
                attempt,
                httpStatus: response.status,
                markerPresent: html.includes(expectedMarker),
                universalRulePresent: html.includes(requiredRule),
                cacheControl: response.headers.get('cache-control'),
                cfCacheStatus: response.headers.get('cf-cache-status'),
                age: response.headers.get('age'),
                returnedBytes: Buffer.byteLength(html),
                sampleTitle: html.split('<title>')[1]?.split('</title>')[0] ?? null
              };
              console.log(JSON.stringify(lastResult));

              if (response.ok && lastResult.markerPresent && lastResult.universalRulePresent) {
                console.log('PASS: production contains the expected revision marker and universal mobile heading CSS.');
                process.exit(0);
              }
            } catch (error) {
              lastResult = {attempt, requestError: String(error)};
              console.log(JSON.stringify(lastResult));
            }
            if (attempt < 5) await delay(4000);
          }
          throw new Error('Production is still not serving the latest website revision. Last probe: ' + JSON.stringify(lastResult));
          NODE
