name: Publish and verify Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "_headers"
      - ".github/workflows/verify-cloudflare-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-and-verify:
    name: Publish and verify production content
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out the committed website
        uses: actions/checkout@v4

      - name: Detect available Cloudflare deployment route
        id: cf-route
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.WRANGLER_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN || vars.CLOUDFLARE_PAGES_API_TOKEN || vars.WRANGLER_API_TOKEN || vars.CLOUDFLARE_TOKEN || vars.CF_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT }}
          CF_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK || secrets.CF_PAGES_DEPLOY_HOOK || secrets.CLOUDFLARE_DEPLOY_HOOK_URL || vars.CLOUDFLARE_PAGES_DEPLOY_HOOK || vars.CF_PAGES_DEPLOY_HOOK || vars.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then echo "::add-mask::$CF_API_TOKEN"; fi
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "method=wrangler" >> "$GITHUB_OUTPUT"
            echo "Direct upload is available through configured Cloudflare credentials."
          elif [ -n "$CF_DEPLOY_HOOK" ]; then
            echo "method=hook" >> "$GITHUB_OUTPUT"
            echo "A Cloudflare Pages deploy hook is available."
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::warning::No Cloudflare API credential pair or Pages deploy hook was found in the recognized repository secrets/variables."
          fi

      - name: Stage the complete static website payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/index.html
          cp _headers site/_headers
          test -s site/index.html
          test -s site/_headers
          grep -q 'mobile-headings-universal-v3' site/index.html
          grep -q 'html body main .section>.section-head' site/index.html
          echo "Staged both production files and validated the layout revision."

      - name: Deploy using Cloudflare Pages Direct Upload
        if: steps.cf-route.outputs.method == 'wrangler'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.WRANGLER_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN || vars.CLOUDFLARE_PAGES_API_TOKEN || vars.WRANGLER_API_TOKEN || vars.CLOUDFLARE_TOKEN || vars.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site --project-name=bugcat-capoo-ip-research --branch=main

      - name: Trigger Cloudflare Pages Deploy Hook
        if: steps.cf-route.outputs.method == 'hook'
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK || secrets.CF_PAGES_DEPLOY_HOOK || secrets.CLOUDFLARE_DEPLOY_HOOK_URL || vars.CLOUDFLARE_PAGES_DEPLOY_HOOK || vars.CF_PAGES_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 20 --output /tmp/deploy-hook-response.txt --write-out '%{http_code}' --request POST "$CF_DEPLOY_HOOK")"
          echo "Cloudflare deploy-hook HTTP status: $code"
          case "$code" in
            2??) echo "Cloudflare Pages deploy hook accepted the deployment trigger." ;;
            *) echo "::error::Cloudflare deploy hook failed with HTTP $code."; cat /tmp/deploy-hook-response.txt; exit 1 ;;
          esac

      - name: Verify the actual production response
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const target = 'https://bugcat-capoo-ip-research.pages.dev/';
          const expectedMarker = 'mobile-headings-universal-v3';
          const requiredRule = 'html body main .section>.section-head';
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
          let lastResult = {};

          for (let attempt = 1; attempt <= 15; attempt++) {
            try {
              const url = new URL(target);
              url.searchParams.set('_deployment_probe', String(Date.now()) + '-' + attempt);
              const response = await fetch(url, {
                cache: 'no-store',
                headers: {
                  'cache-control': 'no-cache, no-store, max-age=0',
                  'pragma': 'no-cache'
                },
                signal: AbortSignal.timeout(10000)
              });
              const html = await response.text();
              lastResult = {
                attempt,
                httpStatus: response.status,
                markerPresent: html.includes(expectedMarker),
                universalRulePresent: html.includes(requiredRule),
                cacheControl: response.headers.get('cache-control'),
                cfCacheStatus: response.headers.get('cf-cache-status'),
                age: response.headers.get('age'),
                returnedBytes: Buffer.byteLength(html),
                sampleTitle: html.split('<title>')[1]?.split('</title>')[0] ?? null
              };
              console.log(JSON.stringify(lastResult));

              if (response.ok && lastResult.markerPresent && lastResult.universalRulePresent) {
                console.log('PASS: production contains the expected revision marker and universal mobile heading CSS.');
                process.exit(0);
              }
            } catch (error) {
              lastResult = {attempt, requestError: String(error)};
              console.log(JSON.stringify(lastResult));
            }
            if (attempt < 15) await delay(8000);
          }
          throw new Error('Production is still not serving the latest website revision. Last probe: ' + JSON.stringify(lastResult));
          NODE
